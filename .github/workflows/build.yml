name: Build Diag
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          uname -m
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project Cheat.xcodeproj \
            -scheme Diag \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Sign and package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Diag.app"
          if [ ! -d "$APP" ]; then echo "App bundle missing at $APP"; exit 1; fi
          echo "--- executable name ---"
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "CFBundleExecutable = $EXE"
          test -f "$APP/$EXE"
          echo "--- strip old signature ---"
          codesign --remove-signature "$APP" || true
          echo "--- sign executable with entitlements ---"
          codesign --force --sign - --entitlements sources/entitlements.plist --timestamp=none "$APP/$EXE"
          echo "--- sign bundle ---"
          codesign --force --sign - --entitlements sources/entitlements.plist --timestamp=none "$APP"
          echo "--- verify ---"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- embedded entitlements (signed executable) ---"
          codesign -d --entitlements :- "$APP/$EXE" 2>&1 | tee "$RUNNER_TEMP/signed-entitlements.xml"
          for key in task_for_pid-allow get-task-allow com.apple.private.cs.debugger platform-application; do
            grep -q "<key>$key</key>" "$RUNNER_TEMP/signed-entitlements.xml" || { echo "ERROR: $key was not embedded in $EXE"; exit 1; }
          done
          echo "--- entitlement check: PASS ---"
          echo "--- CodeResources contents ---"
          cat "$APP/_CodeSignature/CodeResources" | head -80
          rm -f "$GITHUB_WORKSPACE/Diag.tipa"
          cd "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          rm -rf Payload
          mkdir Payload
          cp -R Diag.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Diag.tipa" Payload
          rm -rf Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh Diag.tipa
      - name: Verify entitlements in Diag.tipa
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/verify"
          mkdir -p "$RUNNER_TEMP/verify"
          ditto -x -k Diag.tipa "$RUNNER_TEMP/verify"
          BIN="$RUNNER_TEMP/verify/Payload/Diag.app/COPSDiag"
          test -f "$BIN"
          if command -v ldid >/dev/null 2>&1; then
            echo "--- ldid -e Payload/Diag.app/COPSDiag ---"
            ldid -e "$BIN" | tee "$GITHUB_WORKSPACE/entitlements-verify.txt"
          else
            echo "--- ldid not installed; codesign -d --entitlements :- ---"
            codesign -d --entitlements :- "$BIN" 2>&1 | tee "$GITHUB_WORKSPACE/entitlements-verify.txt"
          fi
          echo ""
          echo "--- entitlement keys ---"
          for key in task_for_pid-allow get-task-allow com.apple.private.cs.debugger platform-application; do
            if grep -q "<key>$key</key>" "$GITHUB_WORKSPACE/entitlements-verify.txt"; then
              echo "present: $key"
            else
              echo "MISSING: $key"
              exit 1
            fi
          done
      - name: Upload entitlements dump
        uses: actions/upload-artifact@v4
        with:
          name: Diag-entitlements
          path: entitlements-verify.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Diag.tipa
          path: Diag.tipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

