name: Build Diag
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          uname -m
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project Cheat.xcodeproj \
            -scheme Diag \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Sign and package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Diag.app"
          if [ ! -d "$APP" ]; then echo "App bundle missing at $APP"; exit 1; fi
          echo "--- executable name ---"
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "CFBundleExecutable = $EXE"
          test -f "$APP/$EXE"
          echo "--- strip old signature ---"
          codesign --remove-signature "$APP" || true
          echo "--- sign executable with entitlements ---"
          codesign --force --sign - --entitlements sources/entitlements.plist --timestamp=none "$APP/$EXE"
          echo "--- sign bundle ---"
          codesign --force --sign - --entitlements sources/entitlements.plist --timestamp=none "$APP"
          echo "--- verify ---"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- CodeResources contents ---"
          cat "$APP/_CodeSignature/CodeResources" | head -80
          rm -rf "$RUNNER_TEMP/Payload" "$GITHUB_WORKSPACE/Diag.tipa"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/Diag.tipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh Diag.tipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Diag-tipa
          path: Diag.tipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

